version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: odk-platform-postgres
    environment:
      POSTGRES_DB: odk_platform
      POSTGRES_USER: odk_user
      POSTGRES_PASSWORD: odk_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odk_user -d odk_platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odk-platform-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/odk_platform
      SPRING_DATASOURCE_USERNAME: odk_user
      SPRING_DATASOURCE_PASSWORD: odk_pass
      SPRING_FLYWAY_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: odk-platform-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: