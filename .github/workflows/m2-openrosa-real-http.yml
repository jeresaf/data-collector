name: M2 OpenRosa Real HTTP Smoke

on:
  push:
    branches:
      - codex/m2-odk2026-integration-gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m2-real-http-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loopback-http:
    name: M2 actual HTTP (synthetic project, transient H2)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: HTTP discovery through multipart submission and duplicate retry
        run: |
          mvn -B -ntp -Dtest='OpenRosaRealHttpIntegrationTest,OpenRosaBasicAuthIntegrationTest#odk2026*' test
      - name: Publish Surefire evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m2-real-http-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  postgres-http:
    name: M2 actual HTTP (isolated PostgreSQL 15 + Flyway)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify local Docker engine is available
        run: docker info
      - name: Real HTTP loopback against disposable PostgreSQL
        run: mvn -B -ntp -Dtest=OpenRosaRealHttpPostgresIT test
      - name: Publish PostgreSQL HTTP evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m2-postgres-real-http-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
