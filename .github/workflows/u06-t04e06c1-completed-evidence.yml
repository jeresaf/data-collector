name: U06-T04E-06C1 Completed follow-up evidence
on:
  push:
    branches: [codex/u06-t04e06c1-completed-evidence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  http-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-class: [OpenRosaRealHttpIntegrationTest, OpenRosaRealHttpPostgresIT]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp '-Dtest=${{ matrix.test-class }}#u06CompletedEvidenceIsExactOwnedBoundAndVerifiesStoredBytes+m3NewSecondVisitIsNewSubmissionAndNeverReplacesVisitOne+m3AmendmentOnPublishedVersionTwoPreservesVersionOneHistory' test
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.test-class }}
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
