name: CI Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (H2)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: backend

    env:
      PYXFORM_COMMAND: ${{ github.workspace }}/backend/.ci-pyxform/bin/xls2xform

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Install pyxform 4.5.0
        run: |
          python3 -m venv .ci-pyxform
          .ci-pyxform/bin/python -m pip install --upgrade pip
          .ci-pyxform/bin/pip install "pyxform==4.5.0"
          test -x .ci-pyxform/bin/xls2xform

      - name: Resolve Maven dependencies with retry
        run: |
          for attempt in 1 2 3; do
            if mvn -B -ntp -U -DskipTests dependency:go-offline; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Maven dependency resolution failed after 3 attempts."
              exit 1
            fi

            sleep_seconds=$((attempt * 20))
            echo "Maven Central request failed; retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Run backend test suite
        run: mvn -B -ntp clean test

      - name: Upload Surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  postgres-testcontainers:
    name: PostgreSQL Testcontainers
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker
        run: docker info

      - name: Run real PostgreSQL migration/schema gate
        run: mvn -B -ntp -Dtest=PostgreSqlContainerMigrationIT,OpenRosaRealHttpPostgresIT,EntityListPostgresLedgerContractIT test

      - name: Upload PostgreSQL Surefire report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: postgresql-testcontainers-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend unit, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
