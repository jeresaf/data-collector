name: M3D4C2B2B2B Inactive External Checkpoint Inclusion Qualification

on:
  push:
    branches:
      - codex/m3d4c2b2b2b-checkpoint-inclusion-proof
  pull_request:
    branches:
      - codex/m3d4c2b2b2-inactive-external-attestation-verifier
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3d4c2b2b2a-external-attestation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-schema-h2:
    name: External log checkpoint inclusion HTTP on H2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -Dtest=OpenRosaRealHttpIntegrationTest,SubmissionReplacementServiceTest,StaticTypedMappingFieldPolicyTest,NativeTypedMappingSchemaProbeTest,SignedMappingGrantVerifierTest,ExternalCeremonyAttestationVerifierTest,ExternalCeremonyCheckpointVerifierTest test
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3d4c2b2b2b-h2-evidence
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  source-schema-postgres:
    name: External log checkpoint inclusion HTTP on PostgreSQL 15
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: docker info
      - run: mvn -B -ntp -Dtest=OpenRosaRealHttpPostgresIT,StaticTypedMappingFieldPolicyTest,NativeTypedMappingSchemaProbeTest,SignedMappingGrantVerifierTest,ExternalCeremonyAttestationVerifierTest,ExternalCeremonyCheckpointVerifierTest test
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3d4c2b2b2b-postgres-evidence
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore
