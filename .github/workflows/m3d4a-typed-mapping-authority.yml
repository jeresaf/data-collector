name: M3D4A Deny-Only Typed Mapping Authority Qualification

on:
  push:
    branches:
      - codex/m3d4a-typed-mapping-authority-deny
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3d4a-typed-authority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-schema-h2:
    name: Deny-only mapping authority HTTP on H2
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp -Dtest=OpenRosaRealHttpIntegrationTest,SubmissionReplacementServiceTest test
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3d4a-h2-evidence
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  source-schema-postgres:
    name: Deny-only mapping authority HTTP on PostgreSQL 15
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: docker info
      - run: mvn -B -ntp -Dtest=OpenRosaRealHttpPostgresIT test
      - if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3d4a-postgres-evidence
          path: backend/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore
