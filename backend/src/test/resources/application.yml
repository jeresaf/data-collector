spring:
  application:
    name: odk-platform
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
  flyway:
    enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__initial_schema_test.sql
      data-locations: classpath:data.sql

app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLXB1cnBvc2VzLW9ubHktbXVzdC1iZS1iYXNlNjQtZW5jb2RlZA==
    expiration: 3600000
    refresh-expiration: 7200000

logging:
  level:
    org.odk.platform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.test: DEBUG